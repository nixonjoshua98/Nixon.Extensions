name: Publish.Nuget.All

on:
  workflow_dispatch:
    
  release:
    types:
      - published

jobs:
  publish:
    runs-on: ubuntu-latest
    timeout-minutes: 3

    steps:
      - name: Checkout code
        uses: actions/checkout@v7

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.x.x'

      - name: Restore dependencies
        working-directory: ./src
        run: dotnet restore Nixon.Extensions.slnx

      - name: Build solution
        working-directory: ./src
        run: dotnet build Nixon.Extensions.slnx -c Release --no-restore

      - name: Run tests
        working-directory: ./src
        run: dotnet test Nixon.Extensions.slnx -c Release --no-build

      - name: Pack NuGet packages
        working-directory: ./src
        run: |         
          dotnet pack Nixon.Extensions.Configuration/Nixon.Extensions.Configuration.csproj              -c Release --no-build -o ./dist
          dotnet pack Nixon.Extensions.Serilog.AspNetCore/Nixon.Extensions.Serilog.AspNetCore.csproj    -c Release --no-build -o ./dist
          dotnet pack Nixon.Extensions.EntityFrameworkCore/Nixon.Extensions.EntityFrameworkCore.csproj  -c Release --no-build -o ./dist
          dotnet pack Nixon.Extensions.Hosting.Jobs/Nixon.Extensions.Hosting.Jobs.csproj                -c Release --no-build -o ./dist
          
          dotnet pack Nixon.Extensions.OpenIddict/Nixon.Extensions.OpenIddict.csproj                                          -c Release --no-build -o ./dist
          dotnet pack Nixon.Extensions.OpenIddict.EntityFrameworkCore/Nixon.Extensions.OpenIddict.EntityFrameworkCore.csproj  -c Release --no-build -o ./dist

      - name: NuGet OIDC Login
        uses: NuGet/login@v1
        id: login
        with:
          user: nixonjoshua98

      - name: Push to NuGet.org
        working-directory: ./src
        run: |
          dotnet nuget push "./dist/*.nupkg" \
            --api-key ${{ steps.login.outputs.NUGET_API_KEY }}  \
            --source https://api.nuget.org/v3/index.json \
            --skip-duplicate