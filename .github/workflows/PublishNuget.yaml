name: PublishNuget

on:
  workflow_dispatch:
    
  release:
    types:
      - published

jobs:
  publish:
    runs-on: ubuntu-latest
    timeout-minutes: 3

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.x.x'

      - name: Restore dependencies
        run: dotnet restore Nixon.Net.slnx

      - name: Build solution
        run: dotnet build Nixon.Net.slnx -c Release --no-restore

      - name: Run tests
        run: dotnet test Nixon.Net.slnx -c Release --no-build

      - name: Pack NuGet packages
        run: |
          dotnet pack Nixon.ValueUnion/Nixon.ValueUnion.csproj -c Release --no-build -o ./dist
          
          dotnet pack Nixon.Extensions.Hosting/Nixon.Extensions.Hosting.csproj                          -c Release --no-build -o ./dist
          dotnet pack Nixon.Extensions.Configuration/Nixon.Extensions.Configuration.csproj              -c Release --no-build -o ./dist
          dotnet pack Nixon.Extensions.EntityFrameworkCore/Nixon.Extensions.EntityFrameworkCore.csproj  -c Release --no-build -o ./dist

      - name: Push to NuGet.org
        run: |
          dotnet nuget push "./dist/*.nupkg" --api-key ${{ secrets.NUGET_API_KEY }} --source https://api.nuget.org/v3/index.json --skip-duplicate